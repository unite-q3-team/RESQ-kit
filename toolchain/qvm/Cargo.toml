[package]
name = "qvm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "QVM (Quake 3 VM) toolchain: loader, disasm, cfg, decompile, emu"

[dependencies]

[lints.clippy]
# Instruction/byte indexes are domain values here (dst + i, i + 1, ...), so
# rewriting indexed loops to iterators hurts readability.
needless_range_loop = "allow"
