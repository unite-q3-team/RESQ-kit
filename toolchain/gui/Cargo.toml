[package]
name = "resq-gui"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Interactive QVM analyzer GUI for the RESQ kit"

[dependencies]
qvm = { path = "../qvm" }
resq-plugin-sdk = { git = "https://github.com/unite-q3-team/resq-plugin-sdk" }
eframe = { version = "0.29", features = ["persistence"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 2
